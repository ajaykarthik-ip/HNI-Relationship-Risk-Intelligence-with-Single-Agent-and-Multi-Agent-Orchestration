<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The same mark the header carries: brand indigo tile, white "A".
    Drawn as strokes rather than text so it does not depend on a font being
    available, and kept to one solid tile so it stays legible against a light
    or a dark browser tab.
  -->
  <rect width="32" height="32" rx="7" fill="#4f46e5"/>
  <g fill="none" stroke="#ffffff" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.4 24.4 16 7.6 23.6 24.4"/>
    <path d="M11.9 18.6h8.2"/>
  </g>
</svg>
